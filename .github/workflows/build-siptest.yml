name: Build SipTest.exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyinstaller

      - name: Run tests (loopback mock SIP provider)
        run: python -m pytest -q tests

      - name: Build EXE
        run: >
          pyinstaller --onefile --name SipTest
          --collect-all sounddevice --collect-binaries _sounddevice_data
          siptest.py

      - name: Smoke test the EXE (PortAudio DLL loads, program starts)
        shell: pwsh
        run: |
          .\dist\SipTest.exe --list-devices
          if ($LASTEXITCODE -ne 0) { throw "SipTest.exe --list-devices failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SipTest-windows
          path: |
            dist/SipTest.exe
            siptest.example.json
